<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1a"/>
      <stop offset="0.55" stop-color="#0e1330"/>
      <stop offset="1" stop-color="#1a1238"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2082eb"/>
      <stop offset="1" stop-color="#a884ff"/>
    </linearGradient>
    <linearGradient id="brandV" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2082eb"/>
      <stop offset="1" stop-color="#a884ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5a7cff" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#7b6cff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#7b6cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="1150" y1="0" x2="1260" y2="0">
      <stop offset="0" stop-color="#a884ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#a884ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="trace" gradientUnits="userSpaceOnUse" x1="30" y1="30" x2="500" y2="610">
      <stop offset="0" stop-color="#2082eb"/>
      <stop offset="1" stop-color="#a884ff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="300" cy="320" r="300" fill="url(#glow)"/>

  <!-- circuit traces leaving the chip -->
  <g fill="none" stroke="url(#trace)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.75">
    <path d="M170 250 H110 L80 220 H30"/>
    <path d="M170 320 H40"/>
    <path d="M170 390 H110 L80 420 H30"/>
    <path d="M250 170 V110 L220 80 V30"/>
    <path d="M350 170 V110 L380 80 V30"/>
    <path d="M250 470 V530 L220 560 V610"/>
    <path d="M350 470 V530 L380 560 V610"/>
    <path d="M430 250 H470 L500 220"/>
    <path d="M430 390 H470 L500 420"/>
  </g>
  <g fill="#a884ff">
    <circle cx="30" cy="220" r="6"/><circle cx="40" cy="320" r="6"/><circle cx="30" cy="420" r="6"/>
    <circle cx="220" cy="30" r="6"/><circle cx="380" cy="30" r="6"/>
    <circle cx="220" cy="610" r="6"/><circle cx="380" cy="610" r="6"/>
    <circle cx="500" cy="220" r="6"/><circle cx="500" cy="420" r="6"/>
  </g>

  <!-- the chip: the kernel at the core -->
  <g>
    <g fill="#2c2734" stroke="url(#brandV)" stroke-width="2">
      <rect x="152" y="212" width="18" height="10" rx="2"/><rect x="152" y="252" width="18" height="10" rx="2"/>
      <rect x="152" y="292" width="18" height="10" rx="2"/><rect x="152" y="332" width="18" height="10" rx="2"/>
      <rect x="152" y="372" width="18" height="10" rx="2"/><rect x="152" y="412" width="18" height="10" rx="2"/>
      <rect x="430" y="212" width="18" height="10" rx="2"/><rect x="430" y="252" width="18" height="10" rx="2"/>
      <rect x="430" y="292" width="18" height="10" rx="2"/><rect x="430" y="332" width="18" height="10" rx="2"/>
      <rect x="430" y="372" width="18" height="10" rx="2"/><rect x="430" y="412" width="18" height="10" rx="2"/>
      <rect x="212" y="152" width="10" height="18" rx="2"/><rect x="252" y="152" width="10" height="18" rx="2"/>
      <rect x="292" y="152" width="10" height="18" rx="2"/><rect x="332" y="152" width="10" height="18" rx="2"/>
      <rect x="372" y="152" width="10" height="18" rx="2"/><rect x="412" y="152" width="10" height="18" rx="2"/>
      <rect x="212" y="470" width="10" height="18" rx="2"/><rect x="252" y="470" width="10" height="18" rx="2"/>
      <rect x="292" y="470" width="10" height="18" rx="2"/><rect x="332" y="470" width="10" height="18" rx="2"/>
      <rect x="372" y="470" width="10" height="18" rx="2"/><rect x="412" y="470" width="10" height="18" rx="2"/>
    </g>
    <rect x="170" y="170" width="260" height="300" rx="34" fill="#12162e" stroke="url(#brandV)" stroke-width="5"/>
    <rect x="186" y="186" width="228" height="268" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2"/>
    <image x="195" y="200" width="210" height="210" xlink:href="data:image/svg+xml;base64,"/>
    <text x="300" y="440" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="17" fill="#a884ff" letter-spacing="3">x86_64</text>
  </g>

  <!-- text -->
  <text x="580" y="200" font-family="Inter" font-weight="700" font-size="20" letter-spacing="6" fill="#a884ff">BIGCOMMUNITY</text>
  <text x="574" y="300" font-family="Inter Display" font-weight="800" font-size="112" fill="url(#brand)">linux-big</text>
  <text x="580" y="352" font-family="Inter" font-weight="500" font-size="32" fill="#e6e8f5">The BigCommunity kernel</text>
  <text x="580" y="394" font-family="Inter" font-weight="400" font-size="24" fill="#9aa3c7">Tuned for gaming, fast for everyone.</text>

  <!-- what makes it different -->
  <g font-family="Inter" font-weight="600" font-size="19" fill="#e6e8f5">
    <rect x="580" y="438" width="176" height="44" rx="22" fill="#ffffff" fill-opacity="0.06" stroke="url(#brand)" stroke-width="2"/>
    <text x="668" y="467" text-anchor="middle">BORE scheduler</text>
    <rect x="770" y="438" width="136" height="44" rx="22" fill="#ffffff" fill-opacity="0.06" stroke="url(#brand)" stroke-width="2"/>
    <text x="838" y="467" text-anchor="middle">ADIOS I/O</text>
    <rect x="920" y="438" width="172" height="44" rx="22" fill="#ffffff" fill-opacity="0.06" stroke="url(#brand)" stroke-width="2"/>
    <text x="1006" y="467" text-anchor="middle">Clang ThinLTO</text>
    <rect x="580" y="496" width="176" height="44" rx="22" fill="#ffffff" fill-opacity="0.06" stroke="url(#brand)" stroke-width="2"/>
    <text x="668" y="525" text-anchor="middle">Intel Xe fixes</text>
    <rect x="770" y="496" width="200" height="44" rx="22" fill="#ffffff" fill-opacity="0.06" stroke="url(#brand)" stroke-width="2"/>
    <text x="870" y="525" text-anchor="middle">Handheld support</text>
    <rect x="984" y="496" width="160" height="44" rx="22" fill="#ffffff" fill-opacity="0.06" stroke="url(#brand)" stroke-width="2"/>
    <text x="1064" y="525" text-anchor="middle">kernel.org</text>
  </g>

  <!-- speed lines -->
  <g stroke="url(#fade)" stroke-width="3" stroke-linecap="round" opacity="0.55">
    <path d="M1180 250 H1260"/><path d="M1150 272 H1260"/><path d="M1200 294 H1260"/>
  </g>
</svg>
