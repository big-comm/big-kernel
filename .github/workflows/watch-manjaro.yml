name: 🔎 Keep kernel modules in step

# For every kernel series (linux-big72, linux-big73, ...): sends the kernel
# to be built for testing when its PKGBUILD is ahead of what testing has, and
# rebuilds its module packages (NVIDIA, broadcom-wl, zfs, ...) whenever they
# fall behind: Manjaro published a new driver, or a new kernel was published.
# Then sends the linux-big metapackages to testing once everything they
# depend on is there. See .github/scripts/watch_manjaro.py.

on:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]
    paths:
      - "linux-big*/PKGBUILD"
      - ".github/scripts/**"
      - ".github/workflows/watch-manjaro.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what would be built"
        type: boolean
        default: false
      force:
        description: "Dispatch again builds that were already dispatched, or given up after three attempts"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One watcher at a time, so two runs never dispatch the same build.
    concurrency:
      group: watch-manjaro
      cancel-in-progress: false
    outputs:
      follow: ${{ steps.dispatch.outputs.follow }}
    # contents: write to point a linux-bigNN-stable branch at the commit
    # stable's modules of that series are built from, when stable is behind
    # main.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The history, to find the commit that described stable's kernel.
          fetch-depth: 0

      - name: Test the watcher
        run: python3 -m unittest discover -s .github/scripts -v

      # Which builds were already dispatched, and how many times: a build
      # that does not publish is dispatched again, up to three attempts,
      # instead of every half hour.
      - name: Restore dispatch state
        uses: actions/cache/restore@v4
        with:
          path: watch-state.json
          key: watch-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: watch-state-

      - name: Dispatch the modules that are behind
        id: dispatch
        env:
          # A token allowed to dispatch to big-comm/build-package.
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN || secrets.ORGANIZATION_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: python3 .github/scripts/watch_manjaro.py --state watch-state.json $DRY_RUN $FORCE

      - name: Save dispatch state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: watch-state.json
          key: watch-state-${{ github.run_id }}-${{ github.run_attempt }}

  # Whatever was just sent to build is followed until it is published or
  # fails, and then the watcher runs again: the modules follow a kernel within
  # minutes, a build that failed (most often the network) is dispatched again
  # half an hour later, and the metapackage follows its modules. GitHub runs
  # the schedule hours apart at times (2026-11-09: none for more than five
  # hours), so it cannot be what retries a build.
  # No concurrency group: a group keeps a single pending run and cancels the
  # one before it, which would drop a follow-up.
  follow-up:
    needs: watch
    if: needs.watch.outputs.follow != ''
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      # One word each: "testing:linux-big73=7.3.3-1 testing:linux-big73-zfs=2.4.4-7030301".
      - name: Wait for what was dispatched
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN || secrets.ORGANIZATION_TOKEN }}
          FOLLOW: ${{ needs.watch.outputs.follow }}
        run: |
          read -ra builds <<< "$FOLLOW"
          python3 .github/scripts/watch_manjaro.py --follow "${builds[@]}"

      - name: Run the watcher again
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sSf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/watch-manjaro.yml/dispatches" \
            -d '{"ref": "${{ github.event.repository.default_branch }}"}'
