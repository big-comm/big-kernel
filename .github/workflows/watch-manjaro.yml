name: 🔎 Keep kernel modules in step

# Sends linux-big to be built for testing when its PKGBUILD is ahead of what
# testing has, and rebuilds the module packages (NVIDIA, broadcom-wl, zfs,
# ...) whenever they fall behind: Manjaro published a new driver, or a new
# linux-big was published. See .github/scripts/watch_manjaro.py.

on:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]
    paths:
      - "linux-big/PKGBUILD"
      - "linux-big-*/PKGBUILD"
      - ".github/scripts/**"
      - ".github/workflows/watch-manjaro.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what would be built"
        type: boolean
        default: false
      force:
        description: "Dispatch again builds that were already dispatched"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One watcher at a time, so two runs never dispatch the same build.
    concurrency:
      group: watch-manjaro
      cancel-in-progress: false
    outputs:
      kernel: ${{ steps.dispatch.outputs.kernel }}
    # contents: write to point the linux-big-stable branch at the commit
    # stable's modules are built from, when stable is behind main.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The history, to find the commit that described stable's kernel.
          fetch-depth: 0

      - name: Test the watcher
        run: python3 -m unittest discover -s .github/scripts -v

      # Which builds were already dispatched, so a failing one is not
      # dispatched again every half hour.
      - name: Restore dispatch state
        uses: actions/cache/restore@v4
        with:
          path: watch-state.json
          key: watch-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: watch-state-

      - name: Dispatch the modules that are behind
        id: dispatch
        env:
          # A token allowed to dispatch to big-comm/build-package.
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN || secrets.ORGANIZATION_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: python3 .github/scripts/watch_manjaro.py --state watch-state.json $DRY_RUN $FORCE

      - name: Save dispatch state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: watch-state.json
          key: watch-state-${{ github.run_id }}-${{ github.run_attempt }}

  # When a kernel was just sent to build, wait for it and run the watcher
  # again the moment it is published, so its modules follow within minutes
  # instead of whenever GitHub next runs the schedule (hours, at times).
  # A queue of its own: the watcher keeps following drivers meanwhile.
  modules-after-kernel:
    needs: watch
    if: needs.watch.outputs.kernel != ''
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: watch-kernel-build
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Wait for linux-big ${{ needs.watch.outputs.kernel }} in testing
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN || secrets.ORGANIZATION_TOKEN }}
        run: python3 .github/scripts/watch_manjaro.py --wait-for-kernel "${{ needs.watch.outputs.kernel }}"

      - name: Run the watcher again, for the modules
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sSf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/watch-manjaro.yml/dispatches" \
            -d '{"ref": "${{ github.event.repository.default_branch }}"}'
