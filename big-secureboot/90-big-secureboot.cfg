# big-secureboot: what Easy Anti-Cheat Linux v2 checks besides Secure Boot.
# The IOMMU translates device DMA: on by default on AMD, not on Intel.
# Passthrough is already off in linux-big; said here so nothing turns it on.
# Removing big-secureboot removes this file and rebuilds the menu.
GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT} intel_iommu=on iommu.passthrough=0"
